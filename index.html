<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Made from Fog</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    .holding-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .ledger-link {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.18);
      color: rgba(255, 255, 255, 0.68);
      font: 20px/1 Georgia, serif;
      text-decoration: none;
      backdrop-filter: blur(2px);
      transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .ledger-link:hover,
    .ledger-link:focus-visible {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.82);
      background: rgba(0, 0, 0, 0.36);
      outline: none;
    }
  </style>
</head>

<body>
  <img class="holding-image" src="holding-image.png" alt="A mist-bound landscape">
  <a class="ledger-link" href="archive.html" aria-label="Open the visual ledger" title="Visual ledger">◌</a>
</body>
</html>
